version: "3.3"
services:
  lichcongtac-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lichcongtacvp-backend
    expose:
      - "5000"
    ports:
      - "8081:5000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - DB_PATH=${DB_PATH}
      - TZ=${TZ}
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_ID_SECRET=${PUBLIC_ID_SECRET}
    volumes:
      - ./data_dump:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
