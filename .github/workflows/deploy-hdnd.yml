name: Deploy HĐND to VNPT Cloud

on:
  push:
    branches:
      - hdnd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          export COPYFILE_DISABLE=1
          tar --exclude='.git' --exclude='node_modules' --exclude='bin' --exclude='obj' --exclude='.env' --exclude='data_dump' --exclude='._*' -czf /tmp/deploy-hdnd.tar.gz .
          mv /tmp/deploy-hdnd.tar.gz .

      - name: Copy deployment package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          source: "deploy-hdnd.tar.gz"
          target: "/root/"

      - name: Execute deployment script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          script: |
            mkdir -p /root/lichcongtachdnd
            cd /root/lichcongtachdnd
            tar -xzf /root/deploy-hdnd.tar.gz
            docker compose -p lichcongtachdnd up -d --build
            docker image prune -f || true
            rm -f /root/deploy-hdnd.tar.gz
            
            # Cấu hình Nginx tự động cho Subdomain HĐND
            cat << 'EOF' > /etc/nginx/conf.d/lichcongtachdnd.conf
            server {
                listen 80;
                server_name lichcongtachdnd.vpdtcampha.vn;

                location / {
                    proxy_pass http://127.0.0.1:8082;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /appHub {
                    proxy_pass http://127.0.0.1:8082;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host $host;
                }
            }
            EOF
            
            # Khởi động lại Nginx để nhận cấu hình mới
            systemctl reload nginx || service nginx reload
